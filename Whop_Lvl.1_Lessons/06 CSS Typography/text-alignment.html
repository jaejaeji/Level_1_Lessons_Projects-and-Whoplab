<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=0">
        <title>Text alignment</title>
    </head>
    <style>
        .left {
            text-align: left;
        }

        .center {
            text-align: center;
        }

        .right {
            text-align: right;
        }
    </style>
    <body>
        <p class="left">left aligned</p>
        <p class="center">center aligned</p>
        <p class="right">right aligned</p>
    </body>
</html>

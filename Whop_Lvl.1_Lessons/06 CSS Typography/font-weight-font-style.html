<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=0">
        <title>Font weight and font style</title>
    </head>
    <style>
        .light {
            font-weight: 300;
        }

        .normal {
            font-weight: 400;
        }

        .bold {
            font-weight: 700;
        }

        .italic {
            font-style: italic;
        }
    </style>
    <body>
        <p class="light">light text</p>
        <p class="normal">normal text</p>
        <p class="bold italic">bold and italic text</p>
    </body>
</html>

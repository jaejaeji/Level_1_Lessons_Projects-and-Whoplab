<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Selectors</title>
    <style>
         h1 {
            color: darkblue;
            font-size: 24px;
         }

         p {
            color: darkgreen;
            font-size: 18px;
         }
    </style>
</head>
<body>
    <h1>this is a header</h1>
    <p>description</p>
</body>
</html>

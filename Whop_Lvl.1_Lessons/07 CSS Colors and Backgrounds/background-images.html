<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background images</title>
    <style>
        /* .bg-image {
            background-image: url("20250901_192026.jpg");
            height: 500px;
            background-size: cover;
            background-position: center;
        } */

        /* background positioning */
        .bg-image {
            background-image: url("20250901_192026.jpg");
            background-position: center center;
            /* background-position: bottom left; */
            height: 700px;
        }

        .bg-cover {
            background-size: cover;
        }

        .bg-contain {
            background-size: contain;
        }

       .bg-repeat {
            background-repeat: repeat; 
        }

        .bg-no-repeat {
            background-repeat: no-repeat; 
        }

        .bg-fixed {
            background-attachment: fixed;
        }

        .gradient {
            /* background: linear-gradient(to left, red, blue); */
            background: radial-gradient(circle, red, blue);
        }


    </style>
</head>
<body>
    <div class="bg-image">Background Image</div>
</br>
    <div class="bg-image bg-cover">Background cover</div>
</br>
    <div class="bg-image bg-contain">Background contain</div>
</br>
    <div class="bg-image bg-contain bg-no-repeat">Background contain no-repeat</div>
</br>
    <div class="bg-image bg-cover bg-fixed">Background fixed</div>
</br>
    <div class="bg-image bg-contain bg-no-repeat gradient">Background contain no-repeat</div>

</body>
</html>
